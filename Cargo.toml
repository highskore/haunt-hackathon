[package]
name = "haunt-replay"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# haunt's core, from a checkout of haunt (branch linux-replay) next to this repo.
haunt-core = { path = "../haunt-linux/core", features = ["replay"] }
# Once haunt is public, use this instead, then `cargo update -p haunt-core`. The Dockerfile then
# needs no local copy of haunt.
# haunt-core = { git = "https://github.com/highskore/haunt", rev = "63b006affb678e91e6d895a72a66cca55028d122", features = ["replay"] }
serde_json = "1"
