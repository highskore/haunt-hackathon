[package]
name = "haunt-replay"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# haunt's core, from a checkout of haunt (branch linux-replay) next to this repo.
haunt-core = { path = "../haunt/core", features = ["replay"] }
# Once haunt is public, use this instead, then `cargo update -p haunt-core`. The Dockerfile then
# needs no local copy of haunt.
# haunt-core = { git = "https://github.com/highskore/haunt", rev = "f837ac34a5d8e35ec2227b7d3585eeda1e704a44", features = ["replay"] }
serde_json = "1"
# The MULTIMAXXING engine, from a checkout of haunt-plugins next to this repo.
multimaxxing-engine = { path = "../haunt-plugins/haunt-multimaxxing/crates/engine" }
